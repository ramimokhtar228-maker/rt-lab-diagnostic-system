<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="diagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c" />
      <stop offset="45%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#590404" />
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="diagGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#dc2626" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#diagBg)" />

  <!-- Outer Neon Crimson Ring -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#e11d48" stroke-width="4.5" stroke-opacity="0.6" />

  <!-- Subtle Medical Cross & DNA Grid -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <circle cx="80" cy="80" r="3" fill="#38bdf8" />
    <circle cx="432" cy="80" r="3" fill="#38bdf8" />
    <path d="M 60 400 L 160 400 L 180 370 L 200 430 L 220 380 L 240 400 L 452 400" fill="none" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- 3D Crystal Blood Droplet -->
  <g filter="url(#diagGlow)">
    <path d="M256 65 C256 65 390 235 390 330 C390 402 330 455 256 455 C182 455 122 402 122 330 C122 235 256 65 256 65 Z" fill="url(#crimsonGrad)" />
    <!-- Gloss Highlight -->
    <path d="M256 95 C256 95 355 240 355 325 C355 365 330 400 295 425 C330 385 340 340 330 310 C315 235 256 125 256 95 Z" fill="url(#gloss)" />
  </g>

  <!-- Metallic Monogram R (Rose/Red) and T (White) -->
  <text x="256" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="118" font-weight="900" text-anchor="middle" letter-spacing="-3">
    <tspan fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.8))">R</tspan><tspan fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.8))">T</tspan>
  </text>

  <!-- Distinct Diagnostics Tagline Pill -->
  <g transform="translate(256, 436)">
    <rect x="-160" y="-22" width="320" height="44" rx="22" fill="#090d16" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#38bdf8" letter-spacing="4" text-anchor="middle">
      DIAGNOSTICS · نتائج
    </text>
  </g>
</svg>

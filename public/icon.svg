<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="40%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Ring Glow -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#991b1b" stroke-width="4" stroke-opacity="0.4" />

  <!-- Crystal Blood Drop -->
  <g filter="url(#shadow)">
    <!-- Main Drop Path -->
    <path d="M256 70 C256 70 380 230 380 320 C380 388 324 442 256 442 C188 442 132 388 132 320 C132 230 256 70 256 70 Z" fill="url(#crimsonGrad)" />
    <!-- Gloss Highlight -->
    <path d="M256 95 C256 95 350 235 350 315 C350 350 330 380 300 405 C330 370 340 330 330 300 C315 230 256 120 256 95 Z" fill="url(#gloss)" />
  </g>

  <!-- RT Monogram -->
  <text x="256" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="110" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="-3">
    <tspan fill="#f43f5e">R</tspan><tspan fill="#ffffff">T</tspan>
  </text>
  <text x="256" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#cbd5e1" letter-spacing="6">
    LABS
  </text>
</svg>
